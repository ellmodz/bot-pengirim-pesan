<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELLCLOUD | Under Construction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #131722;
            --accent-blue: #0088ff;
            --accent-cyan: #00f0ff;
            --accent-warning: #ffaa00;
            --text-main: #f0f3f9;
            --text-muted: #6e768e;
            --border-color: #1f2538;
            --font-head: 'Syne', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.035;
            pointer-events: none;
            z-index: 10;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .grid-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 20;
            max-width: 680px;
            width: 90%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 3rem;
            box-shadow: 12px 12px 0px 0px rgba(0, 136, 255, 0.15);
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.25rem;
            margin-bottom: 2rem;
            font-family: var(--font-code);
            font-size: 0.85rem;
        }

        .brand-name {
            color: var(--accent-cyan);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .status-tag {
            color: var(--accent-warning);
            background: rgba(255, 170, 0, 0.08);
            border: 1px solid var(--accent-warning);
            padding: 4px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-warning);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-warning);
        }

        h1 {
            font-family: var(--font-head);
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent-blue);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .progress-box {
            background: #090b0e;
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            font-family: var(--font-code);
        }

        .progress-title {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #1a202c;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 65%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
        }

        footer {
            margin-top: 2rem;
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer a {
            color: var(--text-main);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent-cyan);
        }

        footer a:hover {
            color: var(--accent-cyan);
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.75rem;
            }
            
            .status-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div class="grid-bg"></div>

    <div class="container">
        <div class="status-header">
            <span class="brand-name">// ELLCLOUD_NODE</span>
            <div class="status-tag">
                <span class="status-dot"></span> BUILDING IN PROGRESS
            </div>
        </div>

        <main>
            <h1>SELAMAT DATANG DI <span>ELLCLOUD</span></h1>
            <p class="subtitle">Website ini sedang dalam tahap pembuatan. Kami sedang mempersiapkan infrastruktur cloud berkinerja tinggi untuk Anda.</p>
            
            <div class="progress-box">
                <div class="progress-title">
                    <span>STATUS DEPLOYMENT</span>
                    <span>65%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                </div>
            </div>
        </main>

        <footer>
            <span>&copy; 2026 ELLCLOUD</span>
            <span>SYSTEM ARCHITECTURE</span>
        </footer>
    </div>

</body>
</html>
